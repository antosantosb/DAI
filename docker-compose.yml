services:
  # ==========================================
  # 1. BROKER MQTT (Mosquitto)
  # ==========================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/config/acl.conf:/mosquitto/config/acl.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    # Sprint -1 (SEC-1): gerar passwd file a partir das env vars antes de iniciar.
    # Hashes ficam apenas na memoria do container; passwords reais em .env (gitignored).
    environment:
      - MQTT_BACKEND_PASSWORD=${MQTT_BACKEND_PASSWORD:?MQTT_BACKEND_PASSWORD obrigatoria}
      - MQTT_SIMULATOR_PASSWORD=${MQTT_SIMULATOR_PASSWORD:?MQTT_SIMULATOR_PASSWORD obrigatoria}
      - MQTT_NIFI_PASSWORD=${MQTT_NIFI_PASSWORD:?MQTT_NIFI_PASSWORD obrigatoria}
      - MQTT_BUS_PASSWORD=${MQTT_BUS_PASSWORD:?MQTT_BUS_PASSWORD obrigatoria}
    command: >
      sh -c "
        rm -f /mosquitto/config/passwd &&
        touch /mosquitto/config/passwd &&
        mosquitto_passwd -b /mosquitto/config/passwd backend   $$MQTT_BACKEND_PASSWORD &&
        mosquitto_passwd -b /mosquitto/config/passwd simulator $$MQTT_SIMULATOR_PASSWORD &&
        mosquitto_passwd -b /mosquitto/config/passwd nifi      $$MQTT_NIFI_PASSWORD &&
        mosquitto_passwd -b /mosquitto/config/passwd bus       $$MQTT_BUS_PASSWORD &&
        echo 'Mosquitto passwd gerado para 4 users' &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf
      "
    networks:
      - mqtt_net

  # ==========================================
  # 2. SIMULADOR DE TELEMETRIA
  # ==========================================
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: simulator
    restart: unless-stopped
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=tub/telemetry
      - INTERVAL_SECONDS=1
      - BACKEND_URL=http://spring-boot-backend:8081
      - PGU_INTERNAL_API_KEY=${PGU_INTERNAL_API_KEY:?PGU_INTERNAL_API_KEY tem de estar definida no .env}
      # Sprint -1 (SEC-1) — Mosquitto auth
      - MQTT_USERNAME=simulator
      - MQTT_PASSWORD=${MQTT_SIMULATOR_PASSWORD:?MQTT_SIMULATOR_PASSWORD obrigatoria}
    depends_on:
      mosquitto:
        condition: service_started
      spring-boot-backend:
        condition: service_started
      osrm:
        condition: service_started
    networks:
      - mqtt_net
      - etl_net
      - osrm_net

  # ==========================================
  # 3. MOTOR ETL (Apache NiFi)
  # ==========================================
  nifi:
    image: apache/nifi:2.0.0
    container_name: nifi
    restart: unless-stopped
    environment:
      - NIFI_WEB_HTTPS_HOST=0.0.0.0
      - NIFI_WEB_PROXY_HOST=${DOMAIN}
      - NIFI_WEB_PROXY_CONTEXT_PATH=/nifi
      - SINGLE_USER_CREDENTIALS_USERNAME=${NIFI_USERNAME}
      - SINGLE_USER_CREDENTIALS_PASSWORD=${NIFI_PASSWORD}
      - PGU_INTERNAL_API_KEY=${PGU_INTERNAL_API_KEY:?PGU_INTERNAL_API_KEY tem de estar definida no .env}
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
    depends_on:
      - mosquitto
      - spring-boot-backend
    networks:
      - mqtt_net
      - etl_net
      - osrm_net

  # ==========================================
  # 4. DATA WAREHOUSE (PostgreSQL + PostGIS)
  # ==========================================
  postgres_postgis:
    image: postgis/postgis:15-3.4
    container_name: datawarehouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${DW_USER}
      POSTGRES_PASSWORD: ${DW_PASSWORD}
      POSTGRES_DB: ${DW_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dw_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DW_USER} -d ${DW_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 5. CONTEXT BROKER (FIWARE Orion + MongoDB)
  # ==========================================
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - orion_db_net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  fiware_orion:
    image: fiware/orion:3.9.0
    container_name: orion
    restart: unless-stopped
    command: -dbhost mongodb -dbuser ${MONGO_USER} -dbpwd ${MONGO_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - orion_db_net
      - etl_net

  # ==========================================
  # 6. DB FERRAMENTAS (Keycloak + Metabase)
  # ==========================================
  toolsbd:
    image: postgres:15
    container_name: toolsbd
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TOOLS_DB_USER}
      POSTGRES_PASSWORD: ${TOOLS_DB_PASSWORD}
    volumes:
      - tools_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - tools_db_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TOOLS_DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 7. GESTÃO DE IDENTIDADE (Keycloak)
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.4
    container_name: keycloak
    restart: unless-stopped
    # Sprint 0 (F5): import com --override true antes do start-dev para
    # forçar reimportação do realm mesmo quando ja existe na DB Postgres.
    # Sem isto, mudancas ao pgu-realm-realm.json (otpPolicy, locales,
    # requiredActions, etc.) NUNCA sao aplicadas se o realm ja existe.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/keycloak/bin/kc.sh import
        --file /opt/keycloak/data/import/pgu-realm-realm.json
        --override true
        || true;
        exec /opt/keycloak/bin/kc.sh start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://toolsbd:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${TOOLS_DB_USER}
      KC_DB_PASSWORD: ${TOOLS_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${IAM_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${IAM_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/pgu-realm-realm.json:/opt/keycloak/data/import/pgu-realm-realm.json:ro
      - ./keycloak/themes/pgu:/opt/keycloak/themes/pgu:ro
    depends_on:
      toolsbd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - tools_db_net
      - auth_net

  # ==========================================
  # 8. DASHBOARDS (Metabase)
  # ==========================================
  metabase:
    image: metabase/metabase:v0.52.4
    container_name: metabase
    restart: unless-stopped
    # Expor porta 3000 ao host para acesso directo em dev (o link do
    # AnalyticsDashboard abre :3000). Em produção, mudar MB_SITE_URL para
    # um sub-dominio dedicado (ex: metabase.${DOMAIN}) em vez de path —
    # Metabase OSS faz chamadas absolutas para /api/* que colidem com o
    # /api/ do Spring Boot quando ambos estao sob o mesmo host.
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: toolsbd
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${METABASE_DB_NAME}
      MB_DB_USER: ${TOOLS_DB_USER}
      MB_DB_PASS: ${TOOLS_DB_PASSWORD}
      MB_SITE_URL: ${METABASE_SITE_URL:-http://localhost:3000}
    depends_on:
      postgres_postgis:
        condition: service_healthy
      toolsbd:
        condition: service_healthy
    networks:
      - tools_db_net
      - dw_net

  # ==========================================
  # 8.1 CAPTURA DE EMAIL (Mailpit, SMTP para dev/demo)
  # ==========================================
  # Sprint 0 (F0): captura todos os emails localmente, web UI em :8025.
  # Em producao basta trocar SMTP_HOST/SMTP_PORT no .env para Gmail/SendGrid.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - storage_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==========================================
  # 8.2 OBJECT STORAGE (MinIO, S3-compatible)
  # ==========================================
  # Sprint 0 (F0): armazenamento de exports, attachments, futuros backups.
  # API em :9000 (presigned URLs precisam de acesso direto do browser em dev),
  # console web em :9001.
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER obrigatoria}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obrigatoria}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # consola web
    volumes:
      - minio_data:/data
    networks:
      - storage_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==========================================
  # 9. BACKEND SPRING BOOT
  # ==========================================
  spring-boot-backend:
    build:
      context: ./pgu
      dockerfile: Dockerfile
    container_name: spring-boot-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_postgis:5432/${DW_NAME}
      - DW_USER=${DW_USER}
      - DW_PASSWORD=${DW_PASSWORD}
      - OSRM_URL=http://osrm:5000
      - PGU_EXPORT_DIR=/var/pgu/exports
      - PGU_INTERNAL_API_KEY=${PGU_INTERNAL_API_KEY:?PGU_INTERNAL_API_KEY tem de estar definida no .env}
      # Sprint -1 (SEC-1): Mosquitto auth
      - MQTT_USERNAME=backend
      - MQTT_PASSWORD=${MQTT_BACKEND_PASSWORD:?MQTT_BACKEND_PASSWORD obrigatoria}
      # Sprint 0 (F0): SMTP via Mailpit em dev
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      # Sprint 0 (F0): MinIO (S3-compatible storage)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER obrigatoria}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obrigatoria}
      - MINIO_EXPORTS_BUCKET=${MINIO_EXPORTS_BUCKET:-exports}
      - MINIO_ATTACHMENTS_BUCKET=${MINIO_ATTACHMENTS_BUCKET:-attachments}
      # Chatbot IA (Rúben): Ollama LLM
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      # qwen2.5:3b (~2.3 GB RAM): bom equilibrio tool-calling vs tamanho.
      # Llama 3.2 1B era pequeno demais e alucinava (ignorava as tools);
      # gemma2:2b precisava 3.4 GB e nao cabia em WSL2 default.
      # Requer .wslconfig com memory=8GB (ou superior) no host Windows.
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      # Motor de Exportação Massiva: persistência dos CSV/PDF gerados (legacy, a migrar para MinIO no F9)
      - pgu_exports:/var/pgu/exports
    depends_on:
      postgres_postgis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      osrm:
        condition: service_started
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      # Sprint 7 (chatbot IA): Ollama e' opcional (profile `ai`). Quando o
      # profile esta ativo, esperar pelo healthcheck evita 503 inicial nas
      # chamadas a /api/v1/ai/*. Quando inativo, o Compose ignora este
      # depends_on (o servico nao existe no projecto).
      ollama:
        condition: service_healthy
        required: false
    networks:
      - dw_net
      - etl_net
      - auth_net
      - osrm_net
      - mqtt_net
      - storage_net
      - ai_net

  # ==========================================
  # 10. OSRM (Routing Engine — Portugal)
  # ==========================================
  osrm:
    build:
      context: ./osrm
      dockerfile: Dockerfile
    container_name: osrm
    restart: unless-stopped
    networks:
      - osrm_net

  # ==========================================
  # 11. FRONTEND (React SPA + Nginx)
  # ==========================================
  pgu-web:
    build:
      context: ./pgu-web
      dockerfile: Dockerfile
    container_name: pgu-web
    restart: unless-stopped
    ports:
      # Mapeamos para 5173/5443 no host para evitar conflito com Apache /
      # IIS / outra coisa que esteja a usar 80/443 no Windows. Em produacao
      # com servidor dedicado, pode-se voltar a 80:80 + 443:443.
      - "5173:80"
      - "5443:443"
    environment:
      # DOMAIN com fallback "localhost" para arranque automatico em dev.
      # Em producao, sobrepor via .env (DOMAIN=pgu.cm-braga.pt).
      - DOMAIN=${DOMAIN:-localhost}
      # EXTERNAL_PORT: porta visivel ao browser. Em dev usamos 5443 (porta
      # 80/443 ocupada pelo Apache). Em prod (Azure) usar 443 standard.
      # Usado em X-Forwarded-Port para Keycloak gerar redirects correctos.
      - EXTERNAL_PORT=${EXTERNAL_PORT:-5443}
    volumes:
      # Volume named (cria-se sozinho) em vez de bind /etc/letsencrypt:ro.
      # Permite ao entrypoint gerar self-signed cert no primeiro arranque
      # sem depender de directorio no host (incompativel com WSL/Mac).
      - letsencrypt_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      - spring-boot-backend
    networks:
      - etl_net
      - auth_net
      - tools_db_net
      - dw_net

  # ==========================================
  # 12. OLLAMA (LLM para chatbot)
  # ==========================================
  ollama:
    image: ollama/ollama:0.5.0
    container_name: ollama
    networks:
      - ai_net
    environment:
      # OLLAMA_KEEP_ALIVE=-1 -> nunca descarregar o modelo da RAM. Por
      # default, Ollama descarrega apos 5min de inactividade, causando
      # cold-start de 30-90s no proximo pedido. -1 = sempre residente.
      - OLLAMA_KEEP_ALIVE=-1
      # 1 modelo carregado, 1 request paralela: foca todos os recursos
      # de CPU na unica query em curso (mais rapido para uso interactivo
      # com 1 utilizador).
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama_models:/root/.ollama
    # mem_limit/mem_reservation: formato Compose v2 (funciona SEM Swarm mode).
    # Antes só tinhamos `deploy.resources` que e' ignorado por `docker compose
    # up` standalone — resultado: o container Ollama ficava com a RAM default
    # (~2.4 GB), insuficiente para o Gemma 2 2B (precisa 3.4 GB). Ollama
    # devolvia {"error":"model requires more memory"} e o Spring AI parser
    # crashava com NPE em message().toolCalls().
    mem_limit: 5g
    mem_reservation: 4g
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 4G
    restart: unless-stopped
    # Não expor portas ao host (segurança); backend acede via DNS interno Docker
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # IMPORTANTE: parar por defeito (poupa RAM). Iniciar manualmente para demos.
    # Para parar por defeito: comment 'restart' OU usar perfil
    profiles:
      - ai

  # ==========================================
  # 13. OLLAMA Init (LLM para chatbot)
  # ==========================================
  ollama-init:
    image: ollama/ollama:0.5.0
    networks:
      - ai_net
    volumes:
      - ollama_models:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: |
      sh -c "ollama pull qwen2.5:3b ; echo 'Model ready'"
    profiles:
      - ai
    restart: "no"

    
# ==========================================
# REDES (Micro-Segmentação Zero Trust)
# ==========================================
#
# mqtt_net:     Simulator -> Mosquitto -> NiFi
# etl_net:      NiFi -> Spring Boot (API) + NiFi -> Fiware Orion (API)
# dw_net:       Spring Boot <-> PostgreSQL/PostGIS + Metabase -> PostGIS
# orion_db_net: Fiware Orion <-> MongoDB
# tools_db_net: Keycloak/Metabase <-> toolsbd (PostgreSQL)
# auth_net:     Spring Boot -> Keycloak (validação JWT)
#
networks:
  mqtt_net:
    driver: bridge
  etl_net:
    driver: bridge
  dw_net:
    driver: bridge
  orion_db_net:
    driver: bridge
  tools_db_net:
    driver: bridge
  auth_net:
    driver: bridge
  osrm_net:
    driver: bridge
  # Sprint 0 (F0): backend, MinIO e Mailpit isolados das outras redes
  storage_net:
    driver: bridge
  # Chatbot IA (Rúben): Ollama isolado
  ai_net:
    driver: bridge


# ==========================================
# VOLUMES
# ==========================================
volumes:
  mosquitto_data:
  mosquitto_log:
  nifi_conf:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  postgres_data:
  mongo_data:
  tools_data:
  pgu_exports:
  certbot_webroot:
  # Volume named para os certificados SSL (self-signed em dev, Let's Encrypt
  # em prod). Evita bind /etc/letsencrypt:ro que falha em WSL/Mac.
  letsencrypt_data:
  # Sprint 0 (F0): dados do MinIO (exports, attachments, futuros backups)
  minio_data:
  # Chatbot IA (Rúben): modelos do Ollama
  ollama_models:
    name: pgu_ollama_models

