# =================================================================
# Mosquitto Access Control List (ACL) — Sprint -1 (SEC-1)
# Permissoes por user (definidas em mosquitto/config/passwd).
# =================================================================

# ─── simulator ─── (publica telemetria, paineis, diagnostics, tickets)
user simulator
topic write tub/telemetry
topic write tub/dispatch/+/ack
topic read tub/dispatch/+
# Sprint 5 (follow-up): paineis DMS + diagnostics + tickets
topic write tub/panels/heartbeat
topic write tub/diagnostics
topic write tub/ticket/#
topic read tub/panels/+/content

# ─── backend ─── (Spring Boot — despacho, ACKs, paineis push e heartbeat)
user backend
topic readwrite tub/telemetry
topic write tub/dispatch/#
topic read tub/dispatch/+/ack
# Sprint 5 (follow-up): conteudo de paineis (push) e heartbeats (subscribe direto)
topic write tub/panels/+/content
topic read tub/panels/heartbeat

# ─── nifi ─── (ingestao de telemetria, paineis, diagnostics, tickets para o backend)
user nifi
topic read tub/telemetry
# Sprint 5 (follow-up): subscribe dos 3 pipelines do NiFi
topic read tub/panels/heartbeat
topic read tub/diagnostics
topic read tub/ticket/#

# ─── bus ─── (consola motorista / dispositivo embarcado real)
user bus
topic read tub/dispatch/+
topic write tub/dispatch/+/ack
