# =================================================================
# Mosquitto Access Control List (ACL) — Sprint -1 (SEC-1)
# Permissoes por user (definidas em mosquitto/config/passwd).
# =================================================================

# ─── simulator ─── (publica telemetria de autocarros)
user simulator
topic write tub/telemetry
topic write tub/dispatch/+/ack
topic read tub/dispatch/+

# ─── backend ─── (Spring Boot — despacho, ACKs)
user backend
topic readwrite tub/telemetry
topic write tub/dispatch/#
topic read tub/dispatch/+/ack

# ─── nifi ─── (ingestao de telemetria para PostGIS/Orion)
user nifi
topic read tub/telemetry

# ─── bus ─── (consola motorista / dispositivo embarcado real)
user bus
topic read tub/dispatch/+
topic write tub/dispatch/+/ack
