# ==========================================
# PROFILE STRUCTURE (Sprint -1 — BE-18)
# ==========================================
# Este ficheiro contém os defaults base partilhados por todos os profiles.
# Profiles disponíveis:
#   - (default)  → dev local (sem profile ativo)
#   - docker     → application-docker.properties (overrides para correr em container)
#   - prod       → application-prod.properties   (deploy Azure, logging WARN, sem swagger)
#
# Ativar com:  SPRING_PROFILES_ACTIVE=prod
# ==========================================

# ==========================================
# CONFIGURAÇÃO DO SERVIDOR
# ==========================================
server.port=8081
# Compression (Sprint -1 — BE-20) — reduz tráfego em JSONs grandes (telemetria, listings)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
# Graceful shutdown (Sprint -1 — BE-20) — permite terminar requests em curso ao parar
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Otimização Tomcat para carga pesada
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=500
server.tomcat.max-connections=10000

# Upload de ficheiros (GTFS ZIP)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==========================================
# 1. LIGAÇÃO À DATA WAREHOUSE
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/pgu_datawarehouse}
spring.datasource.username=${DW_USER}
spring.datasource.password=${DW_PASSWORD}
# Hibernate valida as tabelas criadas pelo FLYWAY
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Otimização de Batching para gravação de Telemetria
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP — pool de conexões (Sprint -1 — BE-19)
# Defaults otimizados para testes de carga em alta escala
spring.datasource.hikari.maximum-pool-size=80
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
# Sprint 0 (F4 follow-up): 3 min para acomodar imports GTFS longos (centenas
# de rotas + milhares de horarios). O batch de 100 no GtfsService ja reduz
# o tempo da conexao, mas o import total ainda pode passar dos 60s.
spring.datasource.hikari.leak-detection-threshold=180000

# ==========================================
# 2. FLYWAY (Migrações da Data Warehouse)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# 3. SEGURANÇA E ZERO TRUST (KEYCLOAK)
# ==========================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/auth/realms/pgu-realm/protocol/openid-connect/certs
# issuer-uri omitido intencionalmente: o browser obtém tokens via proxy (/auth)
# mas o backend acede ao Keycloak via hostname Docker (keycloak:8080).
# Validar apenas a assinatura via jwk-set-uri evita o issuer mismatch.

# Keycloak Admin API (para gestão de utilizadores pelo backoffice)
pgu.keycloak.server-url=${KEYCLOAK_SERVER_URL:http://keycloak:8080/auth}
pgu.keycloak.realm=${KEYCLOAK_REALM:pgu-realm}
# Admin credentials: o docker-compose passa estas como KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD
# (env vars do container Keycloak) a partir de IAM_ADMIN_USER/IAM_ADMIN_PASSWORD do .env.
# Por isso o backend tem de ler dos MESMOS valores — caso contrario o admin nao bate e
# a chamada a Admin API falha com 401. Cadeia de defaults para retrocompatibilidade.
pgu.keycloak.admin-username=${KEYCLOAK_ADMIN_USER:${IAM_ADMIN_USER:admin}}
pgu.keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:${IAM_ADMIN_PASSWORD:admin}}

# ==========================================
# 3.1 API KEY INTERNA (machine-to-machine: simulador, NiFi)
# Sprint -1 (SEC-8): SEM fallback. Spring falha boot se env var não definida.
# Forca configuracao explicita; impede deploy acidental com chave "changeme".
# ==========================================
pgu.internal.api-key=${PGU_INTERNAL_API_KEY}

# ==========================================
# 4. OSRM (Routing Engine)
# ==========================================
osrm.url=${OSRM_URL:http://osrm:5000}

# ==========================================
# 4.b FIWARE Orion (Context Broker, Sprint 0 F3)
# ==========================================
# O backend faz proxy NGSI-LD para o Orion (NGSI v2 -> NGSI-LD v1.6).
# Endpoint interno na rede etl_net.
pgu.orion.v2-url=${ORION_V2_URL:http://orion:1026/v2}
# @context default devolvido nas respostas NGSI-LD (Smart Data Models FIWARE).
pgu.orion.ld-context=${ORION_LD_CONTEXT:https://smart-data-models.github.io/data-models/context.jsonld}

# ==========================================
# 5. EMAIL (SMTP, Sprint 0 F0: Mailpit em dev, real em prod)
# ==========================================
# Em dev: Mailpit captura tudo localmente (web UI :8025). Defaults validos.
# Em prod: trocar SMTP_HOST/SMTP_PORT/SMTP_USERNAME/SMTP_PASSWORD no .env.
spring.mail.host=${SMTP_HOST:mailpit}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

# ==========================================
# 5.1 ALERTAS CRÍTICOS
# ==========================================
# Cooldown entre alertas repetidos do mesmo autocarro (minutos).
pgu.alertas.cooldown-minutes=${PGU_ALERTAS_COOLDOWN:5}
# Destinatário dos emails de alerta (vazio = email desativado).
pgu.alertas.email.destinatario=${PGU_ALERTAS_EMAIL:}
# Remetente dos emails de alerta.
pgu.alertas.email.remetente=${PGU_ALERTAS_EMAIL_FROM:sistema@tub.pt}
# Thresholds de alarme
pgu.alertas.temperatura-critica-celsius=${PGU_ALERTAS_TEMPERATURA_CRITICA:90}
pgu.alertas.bateria-critica-percentagem=${PGU_ALERTAS_BATERIA_CRITICA:10}
# Escalada automática
pgu.alertas.escalada-critica-minutos=${PGU_ALERTAS_ESCALADA_CRITICA_MINUTOS:10}
pgu.alertas.escalada-normal-minutos=${PGU_ALERTAS_ESCALADA_NORMAL_MINUTOS:120}

# ==========================================
# 6. MOTOR DE EXPORTAÇÃO MASSIVA
# ==========================================
# Diretório onde ficam guardados os relatórios gerados (CSV/PDF).
# No container, montar um volume para /var/pgu/exports.
pgu.export.dir=${PGU_EXPORT_DIR:/var/pgu/exports}
# Retenção automática dos ficheiros (dias). Uma tarefa agendada às 03:00
# Europe/Lisbon apaga ficheiros + rows de jobs concluídos há mais tempo.
pgu.export.retention-days=${PGU_EXPORT_RETENTION_DAYS:7}

# ==========================================
# 7. TELEMETRIA — uptime (duty-cycle)
# ==========================================
# Intervalo de publicação esperado (segundos). Deve refletir o hardware IoT real:
#   - Simulador interno ......... 5
#   - GPS celular (4G/5G) ...... 10-30
#   - MQTT industrial ............ 5-30
#   - LoRaWAN ................. 60-300
pgu.telemetry.expected-interval-sec=${PGU_TELEMETRY_INTERVAL_SEC:5}
# Janela (horas) para cálculo do uptime diário.
pgu.telemetry.uptime-window-hours=${PGU_TELEMETRY_UPTIME_WINDOW:24}

# ==========================================
# 8. GESTÃO DE ANEXOS OCORRÊNCIAS
# ==========================================
pgu.anexos.max-size-bytes=${PGU_ANEXOS_MAX_SIZE:20971520}
pgu.anexos.formatos-permitidos=${PGU_ANEXOS_FORMATOS:jpg,jpeg,png,pdf}
pgu.anexos.pasta=${PGU_ANEXOS_PASTA:/app/uploads/ocorrencias}

# ==========================================
# 9. RETENÇÃO DE HISTÓRICO
# ==========================================
# Retenção de histórico (informativo — enforced a nível de política de backup)
pgu.ocorrencias.retencao-anos=${PGU_OCORRENCIAS_RETENCAO_ANOS:5}

# ==========================================
# 10. DESPACHO OPERACIONAL — Mensagens CM
# ==========================================
# Threshold para considerar autocarro offline (segundos sem telemetria)
pgu.despacho.online-threshold-sec=${PGU_DESPACHO_ONLINE_THRESHOLD:30}
# Timeout de entrega: após X segundos sem ACK, marcar como FALHOU
pgu.despacho.delivery-timeout-sec=${PGU_DESPACHO_DELIVERY_TIMEOUT:10}
# Tópico MQTT de envio (template — {busId} é substituído)
pgu.despacho.mqtt.topico-envio=${PGU_DESPACHO_MQTT_TOPICO_ENVIO:tub/dispatch}
# Tópico MQTT de receção de ACKs
pgu.despacho.mqtt.topico-ack=${PGU_DESPACHO_MQTT_TOPICO_ACK:tub/dispatch/+/ack}
# Host do broker MQTT (dentro da docker network)
pgu.despacho.mqtt.broker-url=${PGU_DESPACHO_MQTT_BROKER:tcp://mosquitto:1883}
# Sprint -1 (SEC-1): Mosquitto auth — sem fallback (falha boot se em falta)
pgu.despacho.mqtt.username=${MQTT_USERNAME:backend}
pgu.despacho.mqtt.password=${MQTT_PASSWORD}

# ==========================================
# 11.a CACHE (Sprint 0 F2: Caffeine)
# ==========================================
# Cache em memoria para queries hot que raramente mudam (rotas, paragens,
# GTFS). Configurado em CacheConfig.java com TTL e size por cache.
spring.cache.type=caffeine
spring.cache.cache-names=routes,stops,gtfs,ngsiLd

# ==========================================
# 11.b STORAGE (Sprint 0 F0: MinIO S3-compatible)
# ==========================================
# Endpoint interno (rede Docker) usado pelo backend para upload/download.
pgu.storage.endpoint=${MINIO_ENDPOINT:http://minio:9000}
# Endpoint publico devolvido nas presigned URLs (browser tem de conseguir aceder).
pgu.storage.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
pgu.storage.access-key=${MINIO_ACCESS_KEY}
pgu.storage.secret-key=${MINIO_SECRET_KEY}
pgu.storage.region=${MINIO_REGION:us-east-1}
pgu.storage.buckets.exports=${MINIO_EXPORTS_BUCKET:exports}
pgu.storage.buckets.attachments=${MINIO_ATTACHMENTS_BUCKET:attachments}
pgu.storage.buckets.avatars=${MINIO_AVATARS_BUCKET:avatars}
# TTL default das presigned URLs (segundos). 86400 = 24h.
pgu.storage.presigned-ttl-seconds=${PGU_STORAGE_PRESIGNED_TTL:86400}

# ==========================================
# 11.c AI / Chatbot (Ollama, integrado do Rúben via cherry-pick)
# ==========================================
# URL do container Ollama (DNS interno Docker)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://ollama:11434}
# Modelo a usar. qwen2.5:3b (~2.3 GB RAM) tem o melhor tool-calling na gama
# 3B, essencial para o assistente consultar dados reais em vez de inventar.
# Requer .wslconfig com >=8GB memory no host Windows.
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5:3b}
# Parametros do modelo. Optimizado para tempo de resposta com Qwen 2.5 3B
# em CPU (sem GPU). num-ctx menor + num-predict menor = inferencia mais rapida.
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.top-p=0.9
spring.ai.ollama.chat.options.top-k=40
# Contexto reduzido: 2048 tokens chegam para historico curto + system prompt.
# Antes era 4096 -> dobrava o trabalho de attention por cada token gerado.
spring.ai.ollama.chat.options.num-ctx=2048
# Output max 256 tokens (~200 palavras). Respostas operacionais sao curtas;
# antes o modelo podia gerar ate 512 tokens, demorando o dobro.
spring.ai.ollama.chat.options.num-predict=256
# Sprint 1 follow-up: pull `when_missing` em vez de `always` — evita
# re-puxar o modelo a cada restart do Spring Boot (que bloqueava o startup
# > 120s e fazia o setup script falhar o healthcheck). Tambem desliga o
# auto-pull do modelo de embedding (`mxbai-embed-large`, ~700MB) que o
# Spring AI Ollama puxa por defeito mesmo sem o usarmos — so' usamos chat.
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.init.embedding.include=false
# Configuracoes PGU especificas para IA
pgu.ai.enabled=${PGU_AI_ENABLED:true}
pgu.ai.max-prompt-length=500
pgu.ai.rate-limit-per-minute=30
pgu.ai.timeout-seconds=60
pgu.ai.session-history-limit=10
pgu.ai.log-retention-days=730

# ==========================================
# 12. ACTUATOR (Sprint -1 — SEC-14 + SEC-actuator)
# ==========================================
# Por defeito expor health, info e prometheus publicamente.
# Sprint 0 (F2): prometheus para scraping de metricas pelo Prometheus/Grafana.
management.endpoints.web.exposure.include=health,info,prometheus
# Sprint 0 (F2): metricas HTTP percentis e SLOs (para alertas).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.tags.application=pgu-tub
# Sprint -1 (SEC-14): show-details=always — operador ve subsystema falhado (DB, MQTT, etc.)
# Em prod sera 'never' (ver application-prod.properties) para reduzir info disclosure.
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false
# SMTP e opcional na nossa app (alertas funcionam sem). Desativar o health check
# para o /actuator/health nao reportar DOWN quando nao ha mail server configurado.
management.health.mail.enabled=false

