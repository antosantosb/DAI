# ==========================================
# CONFIGURAÇÃO DO SERVIDOR
# ==========================================
server.port=8081

# Upload de ficheiros (GTFS ZIP)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==========================================
# 1. LIGAÇÃO À DATA WAREHOUSE
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/pgu_datawarehouse}
spring.datasource.username=${DW_USER}
spring.datasource.password=${DW_PASSWORD}
# Hibernate valida as tabelas criadas pelo FLYWAY
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ==========================================
# 2. FLYWAY (Migrações da Data Warehouse)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# 3. SEGURANÇA E ZERO TRUST (KEYCLOAK)
# ==========================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/auth/realms/pgu-realm/protocol/openid-connect/certs
# issuer-uri omitido intencionalmente: o browser obtém tokens via proxy (/auth)
# mas o backend acede ao Keycloak via hostname Docker (keycloak:8080).
# Validar apenas a assinatura via jwk-set-uri evita o issuer mismatch.

# Keycloak Admin API (para gestão de utilizadores pelo backoffice)
pgu.keycloak.server-url=${KEYCLOAK_SERVER_URL:http://keycloak:8080/auth}
pgu.keycloak.realm=${KEYCLOAK_REALM:pgu-realm}
pgu.keycloak.admin-username=${KEYCLOAK_ADMIN_USER:admin}
pgu.keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# ==========================================
# 3.1 API KEY INTERNA (machine-to-machine: simulador, Airflow)
# ==========================================
pgu.internal.api-key=${PGU_INTERNAL_API_KEY:changeme-internal-key}

# ==========================================
# 4. OSRM (Routing Engine)
# ==========================================
osrm.url=${OSRM_URL:http://osrm:5000}

# ==========================================
# 5. EMAIL (SMTP) — opcional, alertas funcionam sem SMTP configurado
# ==========================================
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

# ==========================================
# 5.1 ALERTAS CRÍTICOS
# ==========================================
# Cooldown entre alertas repetidos do mesmo autocarro (minutos).
pgu.alertas.cooldown-minutes=${PGU_ALERTAS_COOLDOWN:5}
# Destinatário dos emails de alerta (vazio = email desativado).
pgu.alertas.email.destinatario=${PGU_ALERTAS_EMAIL:}
# Remetente dos emails de alerta.
pgu.alertas.email.remetente=${PGU_ALERTAS_EMAIL_FROM:sistema@tub.pt}
# Thresholds de alarme
pgu.alertas.temperatura-critica-celsius=${PGU_ALERTAS_TEMPERATURA_CRITICA:90}
pgu.alertas.bateria-critica-percentagem=${PGU_ALERTAS_BATERIA_CRITICA:10}
# Escalada automática
pgu.alertas.escalada-critica-minutos=${PGU_ALERTAS_ESCALADA_CRITICA_MINUTOS:10}
pgu.alertas.escalada-normal-minutos=${PGU_ALERTAS_ESCALADA_NORMAL_MINUTOS:120}

# ==========================================
# 6. MOTOR DE EXPORTAÇÃO MASSIVA
# ==========================================
# Diretório onde ficam guardados os relatórios gerados (CSV/PDF).
# No container, montar um volume para /var/pgu/exports.
pgu.export.dir=${PGU_EXPORT_DIR:/var/pgu/exports}
# Retenção automática dos ficheiros (dias). Uma tarefa agendada às 03:00
# Europe/Lisbon apaga ficheiros + rows de jobs concluídos há mais tempo.
pgu.export.retention-days=${PGU_EXPORT_RETENTION_DAYS:7}

# ==========================================
# 7. TELEMETRIA — uptime (duty-cycle)
# ==========================================
# Intervalo de publicação esperado (segundos). Deve refletir o hardware IoT real:
#   - Simulador interno ......... 5
#   - GPS celular (4G/5G) ...... 10-30
#   - MQTT industrial ............ 5-30
#   - LoRaWAN ................. 60-300
pgu.telemetry.expected-interval-sec=${PGU_TELEMETRY_INTERVAL_SEC:5}
# Janela (horas) para cálculo do uptime diário.
pgu.telemetry.uptime-window-hours=${PGU_TELEMETRY_UPTIME_WINDOW:24}

# ==========================================
# 8. GESTÃO DE ANEXOS OCORRÊNCIAS
# ==========================================
pgu.anexos.max-size-bytes=${PGU_ANEXOS_MAX_SIZE:20971520}
pgu.anexos.formatos-permitidos=${PGU_ANEXOS_FORMATOS:jpg,jpeg,png,pdf}
pgu.anexos.pasta=${PGU_ANEXOS_PASTA:/app/uploads/ocorrencias}

# ==========================================
# 9. RETENÇÃO DE HISTÓRICO
# ==========================================
# Retenção de histórico (informativo — enforced a nível de política de backup)
pgu.ocorrencias.retencao-anos=${PGU_OCORRENCIAS_RETENCAO_ANOS:5}

# ==========================================
# 10. DESPACHO OPERACIONAL — Mensagens CM
# ==========================================
# Threshold para considerar autocarro offline (segundos sem telemetria)
pgu.despacho.online-threshold-sec=${PGU_DESPACHO_ONLINE_THRESHOLD:30}
# Timeout de entrega: após X segundos sem ACK, marcar como FALHOU
pgu.despacho.delivery-timeout-sec=${PGU_DESPACHO_DELIVERY_TIMEOUT:10}
# Tópico MQTT de envio (template — {busId} é substituído)
pgu.despacho.mqtt.topico-envio=${PGU_DESPACHO_MQTT_TOPICO_ENVIO:tub/dispatch}
# Tópico MQTT de receção de ACKs
pgu.despacho.mqtt.topico-ack=${PGU_DESPACHO_MQTT_TOPICO_ACK:tub/dispatch/+/ack}
# Host do broker MQTT (dentro da docker network)
pgu.despacho.mqtt.broker-url=${PGU_DESPACHO_MQTT_BROKER:tcp://mosquitto:1883}


