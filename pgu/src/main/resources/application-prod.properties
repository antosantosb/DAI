# ==========================================
# PROFILE: prod
# Sprint -1 (BE-18) — overrides para deploy em Azure / produção
# Ativar com: SPRING_PROFILES_ACTIVE=prod (ou prod,docker)
# ==========================================

# ─── Logging ────────────────────────────────
# Defaults silenciosos. App logs ficam em INFO para auditoria operacional.
logging.level.root=WARN
logging.level.dai.tub.pgu=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ─── Swagger / OpenAPI desligado em prod ────
# A UI do Swagger exposta publicamente é vetor de info disclosure.
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ─── Actuator restrito em prod ──────────────
# Só /health e /info públicos. Prometheus apenas se houver scraper interno.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoints.web.base-path=/actuator
management.endpoint.prometheus.access=read_only

# ─── JPA / Hibernate ────────────────────────
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── HikariCP — pool maior em prod ──────────
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

# ─── Servlet ────────────────────────────────
# Tomcat connector tuning para o tier B4ms/E4s_v3
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=8192
server.tomcat.accept-count=100
# Não revelar versão do Spring em headers
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ─── Erros gerais ───────────────────────────
spring.mvc.problemdetails.enabled=true

# ─── Multipart — limite mais apertado em prod ──
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
